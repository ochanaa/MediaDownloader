<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glowGrad)" stroke-width="8" opacity="0.4" />
  
  <!-- Media Play / Download Icon -->
  <g filter="url(#glow)">
    <!-- Play Shape Background -->
    <path d="M190 145 L370 256 L190 367 Z" fill="url(#glowGrad)" />
    <!-- Down Arrow Cutout Symbol -->
    <path d="M256 200 L256 310 M220 280 L256 316 L292 280" stroke="#090d16" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
